<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Примерка профессий</title>
  <meta name="theme-color" content="#121214">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Если что-то сломается при запуске — показать причину прямо на экране,
    // чтобы её можно было сфотографировать.
    window.addEventListener("error", function (e) {
      var box = document.getElementById("boot-error") || document.createElement("pre");
      box.id = "boot-error";
      box.style.cssText = "white-space:pre-wrap;margin:16px;padding:12px;border:2px solid #121214;border-radius:12px;font:13px/1.4 monospace;background:#fff;color:#121214";
      box.textContent += "Ошибка: " + e.message + " (" + (e.filename || "").split("/").pop() + ":" + e.lineno + ")\n";
      (document.body || document.documentElement).appendChild(box);
    });
  </script>
</head>
<body>
  <main class="stage">
    <header class="top">
      <span class="brand">Примерка профессий</span>
      <div class="progress" id="progress" aria-hidden="true"></div>
      <p class="swipe-hint" aria-hidden="true">Листай карточки пальцем ← →</p>
    </header>

    <div class="deck">
      <button class="nav nav-prev" id="prev" aria-label="Предыдущая профессия">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <section class="slot" id="slot" aria-live="polite"><p class="boot">Загружаем…</p></section>
      <button class="nav nav-next" id="next" aria-label="Следующая профессия">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <footer class="react" id="react">
      <button class="r r-yes" data-r="yes"><span class="r-mark">+</span>Интересно</button>
      <button class="r r-maybe" data-r="maybe"><span class="r-mark">?</span>Не знаю</button>
      <button class="r r-no" data-r="no"><span class="r-mark">−</span>Не моё</button>
    </footer>
  </main>

  <script src="data.js"></script>
  <script src="data-more.js"></script>
  <script src="sim-pr.js"></script>
  <script src="sim-vet.js"></script>
  <script src="sim-chef.js"></script>
  <script src="sim-screenwriter.js"></script>
  <script src="sim-director.js"></script>
  <script src="sim-lawyer.js"></script>
  <script src="sim-event.js"></script>
  <script src="sim-teacher.js"></script>
  <script src="path.js"></script>
  <script src="app.js"></script>
</body>
</html>
